# Builds the Windows installer and macOS apps and publishes them as a GitHub
# Release whenever a version tag (e.g. v1.3.0) is pushed. Installed copies of
# Pomofocus check these releases for updates.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npx electron-forge make --arch=${{ matrix.arch }}

      - name: Write checksums for the macOS updater
        if: runner.os == 'macOS'
        working-directory: out/make/zip/darwin/${{ matrix.arch }}
        run: for f in *.zip; do shasum -a 256 "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            out/make/squirrel.windows/**/*
            out/make/zip/darwin/**/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f)
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pomofocus $GITHUB_REF_NAME" \
            --generate-notes
